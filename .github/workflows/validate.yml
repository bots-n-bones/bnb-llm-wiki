name: Validate knowledge base

on:
  pull_request:
  push:
    branches:
      - main
      - codex/svmpx-pilot

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run test:intake
      - run: sh -n scripts/*.sh deploy/*.cron
